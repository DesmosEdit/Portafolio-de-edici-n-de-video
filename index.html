<!doctype html>
<html lang="es" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Desmos · Editor de video para reels, TikTok, YouTube y anuncios</title>
  <meta name="description" content="Desmos, editor de video especializado en reels, TikTok, YouTube y anuncios para redes. Videos con ritmo, hooks y subtítulos que retienen la atención y generan resultados.">
  <meta name="theme-color" content="#06051a">
  <meta name="color-scheme" content="dark">

  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <!-- Open Graph: vista previa al compartir el link. La URL y los textos se pueden cambiar en js/config.js → textos -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://desmosedit.github.io/Portafolio-de-edici-n-de-video/">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="Desmos · Editor de video">
  <meta property="og:description" content="Reels, TikTok, YouTube y anuncios que atrapan en los primeros segundos.">
  <meta property="og:image" content="https://desmosedit.github.io/Portafolio-de-edici-n-de-video/assets/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <script>document.documentElement.classList.replace('no-js', 'js');</script>
  <script>
    window.addEventListener('error', function (ev) {
      var file = String(ev.filename || '');
      if (file.indexOf('config.js') === -1) return;
      document.addEventListener('DOMContentLoaded', function () {
        var box = document.createElement('div');
        box.className = 'config-error';
        box.innerHTML = '<h1>Hay un error en js/config.js</h1><p>La página no puede leer el archivo. Casi siempre falta una coma, una comilla o una llave. Deshaz el último cambio (Ctrl+Z), guarda y recarga. También puedes abrir crear/index.html y descargar el archivo de nuevo.</p><pre></pre>';
        box.querySelector('pre').textContent = ev.message || '';
        document.body.prepend(box);
      });
    });
  </script>
</head>

<body>
  <!-- El contenido visible se arma desde js/config.js. Para editarlo con un formulario, abre crear/index.html -->
  <a class="skip-link" id="skip-link" href="#contenido">Saltar al contenido</a>
  <div class="draft-banner" id="draft-banner" hidden>
    <p>Estás viendo una prueba del formulario. Todavía no reemplaza el archivo publicado.</p>
    <a id="draft-back" href="crear/index.html">Volver a editar</a>
  </div>

  <div class="intro" id="intro" aria-hidden="true">
    <video class="intro__video" src="assets/video/intro.mp4" muted playsinline preload="auto"></video>
    <div class="intro__brand">
      <span class="intro__name">DESMOS</span>
      <span class="intro__role">Editor de video</span>
    </div>
    <button class="intro__skip" type="button" tabindex="-1">Saltar intro</button>
  </div>

  <header class="header" id="header">
    <div class="progress" aria-hidden="true"><span class="progress__bar" id="progress"></span></div>
    <nav class="nav container" aria-label="Principal">
      <a class="brand" href="#inicio">
        <img class="brand__mark" src="assets/img/apple-touch-icon.png" alt="" width="36" height="36">
        <span class="brand__name">DESMOS</span>
      </a>
      <ul class="nav__links" id="nav-links"></ul>
      <a class="btn btn--primary btn--sm nav__cta" id="nav-cta" href="#contacto">Cotizar</a>
      <button class="nav__toggle" type="button" aria-controls="nav-links" aria-expanded="false" aria-label="Abrir menú">
        <span></span><span></span>
      </button>
    </nav>
  </header>

  <main id="contenido"></main>

  <footer class="footer">
    <div class="container footer__inner">
      <a class="brand" href="#inicio">
        <img class="brand__mark" src="assets/img/apple-touch-icon.png" alt="" width="28" height="28" loading="lazy">
        <span class="brand__name">DESMOS</span>
      </a>
      <p id="footer-copy"></p>
      <a class="footer__top" id="footer-top" href="#inicio">Volver arriba ↑</a>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-title" hidden>
    <div class="lightbox__backdrop" data-close></div>
    <div class="lightbox__dialog">
      <div class="lightbox__stage" id="lb-stage"></div>
      <div class="lightbox__bar">
        <div>
          <p class="lightbox__title" id="lb-title"></p>
          <p class="lightbox__meta" id="lb-meta"></p>
        </div>
        <span class="lightbox__count" id="lb-count"></span>
      </div>
    </div>
    <button class="lightbox__close" type="button" data-close aria-label="Cerrar video">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Video anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Video siguiente">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
